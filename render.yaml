services:
  - type: web
    name: children-server
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
      # Payments (WebPay) are off; set to "true" to mount /api/payment/* again
      # (see child-app/src/config/featureFlags.ts for the full checklist).
      - key: ENABLE_PAYMENTS
        value: "false"
      - key: WEBPAY_STORE_ID
        sync: false
      - key: WEBPAY_SECRET_KEY
        sync: false
      - key: WEBPAY_API_URL
        value: https://securesandbox.webpay.by
      - key: PRODUCTION_URL
        sync: false
      - key: SUPER_ADMIN_EMAILS
        sync: false
